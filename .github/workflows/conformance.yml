name: conformance

# The board in CONFORMANCE.md is generated from the repo.
# Pull requests: `check` fails when the board is stale, so the author sees it and runs --write.
# Pushes to master: writers that commit straight to master (robots, quick fixes) do not always
# know about --write, so `regenerate` rebuilds the board from the latest master and commits it
# as its own commit. The drift stays visible: a separate commit with the table diff.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit tests for the board script
        run: python3 -m unittest discover -s tests -v
      - name: Verify the board is current
        run: python3 scripts/conformance_report.py --check

  regenerate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: conformance-regenerate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Unit tests for the board script
        run: python3 -m unittest discover -s tests -v
      - name: Regenerate the board from the latest master if stale
        # Always rebuild on top of the newest tip (no rebase, so no conflicts); if another push
        # lands first, the push is rejected and the loop starts again from the new tip.
        # A protected branch makes the push fail visibly: the job goes red, nothing is hidden.
        run: |
          B="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch -q origin "$B"
            git reset -q --hard "origin/$B"
            if python3 scripts/conformance_report.py --check; then exit 0; fi
            python3 scripts/conformance_report.py --write
            git add CONFORMANCE.md
            git commit -q -m "conformance: regenerate board at $(git rev-parse --short HEAD)" \
              -m "Generated by .github/workflows/conformance.yml: a push changed what the board measures without running scripts/conformance_report.py --write."
            if git push origin "HEAD:$B"; then exit 0; fi
            echo "push rejected (attempt $attempt), retrying from the new tip"
            sleep 5
          done
          exit 1
