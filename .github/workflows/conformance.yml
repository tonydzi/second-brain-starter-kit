name: conformance

# The board in CONFORMANCE.md is generated from the repo.
# Pull requests: the job fails when the board is stale, so the author sees it and runs --write.
# Pushes to master: writers that commit straight to master (robots, quick fixes) do not always
# know about --write, so the job regenerates the board and commits it as its own commit. The
# drift stays visible: it is a separate commit with the table diff, never a silent pass.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  board:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: conformance-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests for the board script
        run: python3 -m unittest discover -s tests -v
      - name: Verify the board is current (pull requests)
        if: github.event_name == 'pull_request'
        run: python3 scripts/conformance_report.py --check
      - name: Regenerate the board if stale (master)
        if: github.event_name == 'push'
        run: |
          if python3 scripts/conformance_report.py --check; then exit 0; fi
          python3 scripts/conformance_report.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CONFORMANCE.md
          git commit -m "conformance: regenerate board after ${GITHUB_SHA::7}" -m "Generated by .github/workflows/conformance.yml: the push changed what the board measures but did not run scripts/conformance_report.py --write."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          python3 scripts/conformance_report.py --check || { python3 scripts/conformance_report.py --write; git add CONFORMANCE.md; git commit --amend --no-edit; }
          git push origin "HEAD:${GITHUB_REF_NAME}"
          python3 scripts/conformance_report.py --check
