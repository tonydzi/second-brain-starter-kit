name: credit

# CONTRIBUTING promises every outside merge a CHANGELOG line by GitHub handle.
# This job keeps the promise: stdlib only, one API read, seconds.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  credit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: the gate itself goes red when it should
        run: python scripts/credit_gate.py --selftest
      - name: every outside merge is credited, every handle exists
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/credit_gate.py --since 2026-10-19
